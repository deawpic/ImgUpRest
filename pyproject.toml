[project]
name = "real-esrgan-gui"
version = "2.1.0"
description = "Cross-Platform Real-ESRGAN NCNN Hybrid GPU+CPU Image Upscaler with PySide6 Desktop GUI"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "realesrgan-ncnn-py>=2.0.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "PySide6>=6.5.0",
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.5.0",
]

[project.scripts]
upscale-gui = "src.gui.app:main"
upscale-cli = "upscale:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
