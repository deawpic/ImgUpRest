name: Release Standalone Windows (Nuitka)

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows-nuitka:
    name: Build Standalone Windows Executable (Nuitka)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: |
          uv python install 3.11
          uv run --python 3.11 python --version

      - name: Install dependencies & Nuitka
        run: |
          uv pip install -e ".[dev]"

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest tests/ -v

      - name: Build Standalone Executable with Nuitka
        run: |
          uv run python -m nuitka `
            --standalone `
            --enable-plugin=pyside6 `
            --include-package=src `
            --include-package-data=realesrgan_ncnn_py `
            --include-package=realesrgan_ncnn_py `
            --include-package=PIL `
            --include-package=cv2 `
            --include-package-data=onnxruntime `
            --include-package=onnxruntime `
            --windows-console-mode=disable `
            --output-dir=dist `
            --output-filename=RealESRGAN_GUI.exe `
            --assume-yes-for-downloads `
            --msvc=latest `
            --lto=no `
            src/gui/app.py

      - name: Prepare distribution directory and zip
        run: |
          if (Test-Path "dist/app.dist") {
            Rename-Item -Path "dist/app.dist" -NewName "RealESRGAN_GUI_Windows"
          }
          if (!(Test-Path "dist/RealESRGAN_GUI_Windows")) {
            Write-Error "Expected build directory dist/RealESRGAN_GUI_Windows not found!"
            exit 1
          }
          Compress-Archive -Path dist/RealESRGAN_GUI_Windows/* -DestinationPath RealESRGAN_GUI_Windows_x64.zip

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealESRGAN_GUI_Windows_x64
          path: RealESRGAN_GUI_Windows_x64.zip
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RealESRGAN_GUI_Windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
