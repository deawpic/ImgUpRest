name: Build Windows Executable (.exe)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: |
          uv python install 3.11
          uv run --python 3.11 python --version

      - name: Install dependencies and PyInstaller
        run: |
          uv pip install -e ".[dev]" pyinstaller

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest tests/ -v

      - name: Build executable with PyInstaller
        run: |
          uv run --python 3.11 pyinstaller --noconfirm packaging/pyinstaller_windows.spec

      - name: Compress build output into ZIP
        run: |
          Compress-Archive -Path dist/RealESRGAN_GUI_Windows/* -DestinationPath RealESRGAN_GUI_Windows_x64.zip

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealESRGAN_GUI_Windows_x64
          path: RealESRGAN_GUI_Windows_x64.zip
          retention-days: 30

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RealESRGAN_GUI_Windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
